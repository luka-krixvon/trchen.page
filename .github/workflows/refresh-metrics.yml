name: Refresh metrics

# Citation counts and Zenodo statistics are baked into the built pages, so they
# are refreshed on a schedule rather than fetched in the visitor's browser:
# a static page cannot call these APIs without CORS trouble, a request per
# visitor, and numbers that crawlers never see.

on:
  schedule:
    - cron: "17 19 * * *"      # 03:17 Taipei daily; change to "17 19 * * 1" for Mondays only
  workflow_dispatch:            # and a Run workflow button for an immediate refresh

permissions:
  contents: write

concurrency:
  group: refresh-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch citation counts and Zenodo statistics
        run: python3 refresh_metrics.py

      - name: Rebuild the pages
        run: python3 build.py

      - name: Commit only if a number actually moved
        run: |
          if git diff --quiet; then
            echo "No change; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh citation and deposit figures

          Automated: python3 refresh_metrics.py && python3 build.py"
          git push
